<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clinic check-in</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<style>
:root{
  --ink:#111111; --paper:#ffffff; --muted:#3d3d3d; --line:#6b6b6b; --accent:#0b4f8a; --accent-ink:#ffffff;
  --soft:#f2f5f8; --focus:#ffb000; --urgent-bg:#7a0010; --urgent-ink:#ffffff; --notice-bg:#fff4d6; --notice-ink:#3d2a00;
  --disabled-bg:#d6d6d6; --disabled-ink:#2b2b2b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#f5f5f5; --paper:#121212; --muted:#d0d0d0; --line:#9a9a9a; --accent:#7fb8ec; --accent-ink:#0b1b2b;
    --soft:#1d2328; --focus:#ffd060; --urgent-bg:#5c0010; --urgent-ink:#ffffff; --notice-bg:#3a2c08; --notice-ink:#ffe9a8;
    --disabled-bg:#3a3a3a; --disabled-ink:#bdbdbd;
  }
}
:root[data-theme="dark"]{
  --ink:#f5f5f5; --paper:#121212; --muted:#d0d0d0; --line:#9a9a9a; --accent:#7fb8ec; --accent-ink:#0b1b2b;
  --soft:#1d2328; --focus:#ffd060; --urgent-bg:#5c0010; --urgent-ink:#ffffff; --notice-bg:#3a2c08; --notice-ink:#ffe9a8;
  --disabled-bg:#3a3a3a; --disabled-ink:#bdbdbd;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{background:var(--paper);color:var(--ink);font:18px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Arabic","Segoe UI Arabic",Tahoma,sans-serif}
header.top{border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;max-width:560px;margin:0 auto}
.brand{margin:0;font-size:18px;font-weight:700}
.langs{display:flex;gap:6px;flex-wrap:wrap}
.langs button{min-height:44px;min-width:44px;padding:8px 12px;font-weight:600;font-size:16px;line-height:1.2;font-family:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:999px;cursor:pointer}
.langs button.on,.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{max-width:560px;margin:0 auto;padding:16px;width:100%}
main:focus{outline:none}
h1{font-size:26px;line-height:1.25;margin:8px 0 12px}
h2{font-size:20px;line-height:1.3;margin:0 0 6px}
p{margin:0 0 12px}
.progress{font-size:16px;color:var(--muted);margin:4px 0 0}
.tag{display:inline-block;font-size:16px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 8px;margin:0 0 6px}
.notice{background:var(--notice-bg);color:var(--notice-ink);border-radius:10px;padding:12px 14px;font-size:18px}
.draftnote{background:var(--soft);border:2px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink);font-weight:600}
.card{background:var(--soft);border-radius:12px;padding:14px 16px;margin:0 0 12px}
:focus{outline:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
fieldset{border:0;margin:0;padding:0;min-width:0}
.answers{margin:8px 0 4px}
.opt{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;margin:0 0 10px;border:2px solid var(--line);border-radius:12px;cursor:pointer;background:var(--paper)}
.opt input{width:24px;height:24px;margin:0;flex:0 0 auto;accent-color:var(--accent)}
.opt-text{flex:1 1 auto;overflow-wrap:anywhere}
.opt:has(input:checked){border-color:var(--accent);border-width:3px;background:var(--soft)}
.sel{font-weight:700;font-size:16px;color:var(--accent);flex:0 0 auto}
.sel[hidden]{display:none}
textarea,input[type=text]{width:100%;max-width:100%;font-size:18px;line-height:1.5;font-family:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:9.5em;resize:vertical}
textarea:disabled{background:var(--soft);color:var(--muted)}
.counter{font-size:16px;color:var(--muted);text-align:end;margin:4px 0 12px}
.counter.warn{color:var(--ink);font-weight:700}
.counter.over{color:var(--urgent-bg);font-weight:700}
.field{display:block;margin:0 0 12px}
.field span{display:block;margin-bottom:4px;font-size:18px}
.field input{max-width:200px}
.scale{margin:0 0 6px}
.scale-row{display:grid;grid-template-columns:repeat(6,minmax(44px,1fr));gap:6px;margin-bottom:6px}
.scale-btn{position:relative;display:flex;align-items:center;justify-content:center;min-height:48px;border:2px solid var(--line);border-radius:10px;cursor:pointer;font-weight:700;font-size:18px;background:var(--paper)}
.scale-btn input{position:absolute;opacity:0;width:100%;height:100%;margin:0;inset:0;cursor:pointer}
.scale-btn:has(input:checked){border:3px solid var(--accent);background:var(--soft)}
.scale-btn:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.scale-ends{display:flex;justify-content:space-between;font-size:16px;color:var(--muted);margin-top:4px}
.readout{font-weight:700;min-height:1.5em;margin-top:6px}
.reason{color:var(--ink);font-size:17px;font-weight:600;min-height:1.2em;margin:8px 0}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-top:8px}
.btn{min-height:48px;min-width:120px;padding:10px 18px;font-weight:600;font-size:18px;line-height:1.2;font-family:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:12px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.quiet{border-color:var(--line);color:var(--muted);min-width:0}
.btn.small{min-height:44px;min-width:44px;font-size:16px;padding:8px 14px;margin-top:6px}
.btn:disabled{background:var(--disabled-bg);color:var(--disabled-ink);border-color:var(--disabled-bg);cursor:not-allowed}
.cancelrow{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:center}
.rev{border-bottom:1px solid var(--line);padding:12px 0}
.rev-q{font-size:16px;color:var(--muted);margin:0}
.rev-a{font-size:19px;font-weight:600;margin:4px 0 0;overflow-wrap:anywhere;white-space:pre-wrap}
.unk ul{margin:0;padding-inline-start:22px}
.urgent{background:var(--urgent-bg);color:var(--urgent-ink);border-radius:14px;padding:18px 18px 20px;margin:0 0 16px;font-size:20px;line-height:1.5}
.urgent h1,.urgent h2{color:var(--urgent-ink);font-size:24px}
.urgent .btn{background:var(--urgent-ink);color:var(--urgent-bg);border-color:var(--urgent-ink)}
.urgent.gate{margin-top:8px}
.phone{font-size:18px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.dialog{background:var(--paper);color:var(--ink);border-radius:14px;padding:20px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:12px}
.dialog .btn{width:100%}
</style>
</head>
<body>
<noscript><main><p>This check-in needs JavaScript. Please ask the front desk for help.</p></main></noscript>
<header class="top">
  <p class="brand" id="brand">Clinic check-in</p>
  <nav class="langs" role="group" aria-label="Language / اللغة / Bahasa">
    <button type="button" data-lang="en" lang="en" aria-pressed="true">English</button>
    <button type="button" data-lang="ar" lang="ar" aria-pressed="false">العربية</button>
    <button type="button" data-lang="ms" lang="ms" aria-pressed="false">Bahasa Melayu</button>
  </nav>
</header>
<main id="app" tabindex="-1"></main>
<div id="live" class="sr" aria-live="polite"></div>
<script src="src/checkin.js"></script>
<script src="src/patient-ui.js"></script>
</body>
</html>
