<style>
/* Layout: phone-first app shell. Sticky header with clock, five views switched by a tab bar (bottom on phones, top on wide screens). */
:root{
  --bg:#e7ebed; --app:#f5f7f8; --surface:#ffffff; --sunk:#edf1f3; --ink:#14202a; --muted:#56636e; --line:#d4dbe0;
  --accent:#2f5d8c; --accent-soft:#e1eaf4;
  --ok:#2b7a4b; --ok-soft:#dfefe5; --warn:#a4620a; --warn-soft:#f7ead6; --crit:#b3261e; --crit-soft:#f7dfdd;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --f-ar:"IBM Plex Sans Arabic","Geeza Pro","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0f12; --app:#10171c; --surface:#162027; --sunk:#1c262d; --ink:#e3e9ed; --muted:#93a1ab; --line:#2a353d;
  --accent:#88b4e0; --accent-soft:#1b2a39; --ok:#6cc08b; --ok-soft:#153020; --warn:#e3a447; --warn-soft:#332614; --crit:#f2867c; --crit-soft:#391b19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f12; --app:#10171c; --surface:#162027; --sunk:#1c262d; --ink:#e3e9ed; --muted:#93a1ab; --line:#2a353d;
  --accent:#88b4e0; --accent-soft:#1b2a39; --ok:#6cc08b; --ok-soft:#153020; --warn:#e3a447; --warn-soft:#332614; --crit:#f2867c; --crit-soft:#391b19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 24px}
.app{max-width:560px;margin:0 auto;background:var(--app);border:1px solid var(--line);border-radius:20px;overflow:hidden;min-height:640px;display:flex;flex-direction:column}
@media (max-width:600px){body{padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));padding-block:0}.app{border:0;border-radius:0;min-height:100vh}}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:21px} h2{font-size:18px} h3{font-size:15px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 14px;display:grid;gap:8px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.clock{display:flex;gap:6px;align-items:center}
.day{font-family:var(--f-mono);font-size:13px;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.notice{font-size:11.5px;color:var(--warn);background:var(--warn-soft);padding:4px 8px;border-radius:6px}
nav.tabs{display:flex;border-top:1px solid var(--line);background:var(--surface);position:sticky;bottom:0;z-index:6;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;font:inherit;font-size:12.5px;font-weight:500;background:none;border:0;color:var(--muted);padding:10px 4px;cursor:pointer;border-top:2px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
nav.tabs .cnt{display:inline-block;min-width:16px;font-family:var(--f-mono);font-size:10.5px;background:var(--crit);color:var(--surface);border-radius:8px;padding:0 4px;margin-left:3px}
main{flex:1;padding:12px;display:grid;gap:10px;align-content:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;min-width:0}
.sec-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
button.act{font:inherit;font-size:14px;font-weight:500;border-radius:8px;padding:8px 12px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.act.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
button.act.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,transparent)}
button.act:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
select,input[type=text]{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.chip{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap}
.c-ok{color:var(--ok);background:var(--ok-soft)} .c-warn{color:var(--warn);background:var(--warn-soft)} .c-crit{color:var(--crit);background:var(--crit-soft)} .c-acc{color:var(--accent);background:var(--accent-soft)} .c-mute{color:var(--muted);background:var(--sunk)}
.src{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;white-space:nowrap}
.badge{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:1px 5px;border-radius:4px}
.b-rec{color:var(--accent);background:var(--accent-soft)} .b-calc{color:var(--ok);background:var(--ok-soft)} .b-ai{color:var(--warn);background:var(--warn-soft)} .b-hum{color:var(--ink);background:var(--sunk);border:1px solid var(--line)}

/* board */
.case-row{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 0;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.case-row .stripe{align-self:stretch;border-radius:10px 0 0 10px;background:var(--line)}
.case-row[data-sev="crit"] .stripe{background:var(--crit)} .case-row[data-sev="warn"] .stripe{background:var(--warn)} .case-row[data-sev="ok"] .stripe{background:var(--ok)}
.case-row .nm{font-weight:600}
.case-row .meta{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.case-row .right{display:grid;justify-items:end;gap:4px}
.stagebar{display:flex;gap:2px}
.stagebar i{width:10px;height:5px;border-radius:2px;background:var(--line)}
.stagebar i[data-s="done"]{background:var(--ok)} .stagebar i[data-s="cur"]{background:var(--accent)} .stagebar i[data-s="late"]{background:var(--crit)}

/* case */
.timeline{list-style:none;margin:0;padding:0;display:grid}
.tl{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;border:1.5px solid var(--line);color:var(--muted)}
.tl[data-s="done"] .dot{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.tl[data-s="cur"] .dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tl[data-s="late"] .dot{border-color:var(--crit);color:var(--crit);box-shadow:0 0 0 3px var(--crit-soft)}
.tl[data-s="skip"] .dot{border-style:dashed}
.tl .t{font-weight:600}
.tl[data-s="todo"] .t{color:var(--muted)}
.tl .m{font-size:12px;color:var(--muted)}
.tl .st{font-size:11.5px;font-weight:600;white-space:nowrap}
.tl[data-s="done"] .st{color:var(--ok)} .tl[data-s="cur"] .st{color:var(--accent)} .tl[data-s="late"] .st{color:var(--crit)}
.tl .body{display:grid;gap:8px;margin-top:8px}
.callout{border-radius:8px;padding:9px 10px;font-size:13.5px;display:grid;gap:4px}
.callout.flag{background:var(--warn-soft);border-left:3px solid var(--warn)}
.callout.block{background:var(--crit-soft);border-left:3px solid var(--crit)}
.callout.ok{background:var(--ok-soft);border-left:3px solid var(--ok)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.rx{display:grid;gap:6px}
.rx label{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:start;padding:7px 8px;border:1px solid var(--line);border-radius:8px;font-size:13.5px}
.rx label[data-k="blocked"]{opacity:.55}
.rx input{margin-top:3px;accent-color:var(--accent)}
.rx .why{display:block;font-size:12px;color:var(--muted)}
.checkline{display:flex;gap:8px;align-items:center;font-size:13.5px}
.checkline input{width:17px;height:17px;accent-color:var(--accent)}
.log{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:12.5px;max-height:220px;overflow:auto}
.log li{display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px}
.log .d{font-family:var(--f-mono);color:var(--muted)}
.log .alert{color:var(--crit)}
.thread{display:grid;gap:6px}
.msg-b{background:var(--sunk);border-radius:8px;padding:7px 9px;font-size:13px}
.msg-b .who{font-size:11px;color:var(--muted)}

/* phone */
.phone{border:1px solid var(--line);border-radius:26px;padding:12px;background:var(--sunk);max-width:360px;width:100%;margin:0 auto}
.screen{background:var(--surface);border-radius:16px;padding:14px;display:grid;gap:10px;min-height:340px;align-content:start}
.lang{display:flex;gap:6px}
.pill{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);padding:4px 10px;border-radius:999px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.pmsg{font-size:14.5px;line-height:1.6}
[dir="rtl"]{font-family:var(--f-ar)}
.tb{display:grid;gap:6px}
.tb button{font:inherit;text-align:start;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tb button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

/* metrics */
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.metric .v{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.metric .k{font-size:12px;color:var(--muted)}
.metric .n{font-size:11px;color:var(--muted)}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 28px;gap:8px;align-items:center;font-size:12.5px}
.bar .track{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:4px}
.bar .num{font-family:var(--f-mono);text-align:right}
.empty{font-size:13.5px;color:var(--muted)}
/* case finder */
.rep{font-size:13.5px;line-height:1.55;background:var(--sunk);border-radius:8px;padding:8px 10px}
.rep mark{background:var(--warn-soft);color:inherit;border-bottom:2px solid var(--warn);padding:0 1px}
.rep[data-d="act"] mark{background:var(--crit-soft);border-bottom-color:var(--crit)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btab{width:100%;border-collapse:collapse;font-size:12.5px}
.btab th,.btab td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
.btab td.n{font-family:var(--f-mono);text-align:right}
.tblwrap{overflow-x:auto}
.missed{font-size:12.5px;color:var(--crit);font-weight:600}
/* patient check-in */
.b-pt{color:var(--accent);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.prog{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
.wq{font-size:16.5px;font-weight:600;line-height:1.4}
.tb button{font-size:15px;padding:11px 12px}
textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;min-height:84px;resize:vertical}
.pcard{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;background:var(--app)}
.rev{display:grid;gap:6px;font-size:13.5px}
.rev div{display:grid;gap:1px;border-bottom:1px solid var(--line);padding-bottom:6px}
.rev .qq{color:var(--muted);font-size:12px}
details.ans summary{cursor:pointer;font-size:12.5px;color:var(--accent)}
.scale{display:flex;flex-wrap:wrap;gap:6px}
.scale button{font:inherit;font-size:15px;min-width:38px;flex:1 0 auto;padding:9px 0;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-align:center}
.scale button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.scale-ends{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-top:4px}
.ci-sec{margin-top:8px}
.ci-row{display:grid;grid-template-columns:minmax(110px,36%) 1fr;gap:8px;font-size:12.5px;padding:3px 0;border-bottom:1px dashed var(--line)}
.ci-k{opacity:.75}
.ci-v{white-space:pre-wrap;overflow-wrap:anywhere}
.ci-urgent{color:var(--crit);font-weight:600} .ci-warn{color:var(--warn)}
@media print{body.ci-printing *{visibility:hidden!important} body.ci-printing .ci-sum,body.ci-printing .ci-sum *{visibility:visible!important} body.ci-printing .ci-sum{position:absolute;left:0;top:0;width:100%;border:0;box-shadow:none} .noprint{display:none!important}}
.flagline{font-size:13px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
/* intake */
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px}
.fgrid .full{grid-column:1/-1}
.field{display:grid;gap:3px;min-width:0}
.field input,.field select{width:100%}
.checks{display:grid;gap:6px}
.fired{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:13.5px}
.fired li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start}
.rid{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-right:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="hrow">
      <div><h1>OsteoLoop</h1><div class="small muted">Osteoporosis: fragility-fracture screening to treatment, closed loop</div></div>
      <div class="clock"><span class="day" id="day">Day 0</span><button class="act" id="adv">+7 days</button><button class="act" id="reset" title="Restore the seeded demo cases">Reset</button></div>
    </div>
    <div class="notice">Prototype · fictional patients · synthetic data · draft rules for clinician sign-off</div>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs" aria-label="Views"></nav>
</div>

<script>
(function(){
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ME = 'Dr Tan';

/* ---------- loop definition ---------- */
const STAGES = [
  {n:0, t:'Screen', role:'Screening clinic', clock:0},
  {n:1, t:'Notify and acknowledge', role:'GP', clock:7},
  {n:2, t:'Confirm: DXA and labs', role:'GP, imaging, lab', clock:30},
  {n:3, t:'Decide or refer', role:'GP, then specialist', clock:7},
  {n:4, t:'Treat: prescribe and dispense', role:'Prescriber', clock:14},
  {n:5, t:'Follow up', role:'GP', clock:90},
  {n:6, t:'Close', role:'GP or programme lead', clock:30}
];
const DROPS = ['Patient declined after counselling','Fear of medication side effects','Dental concern before bisphosphonate','Lost after transfer between providers','Clinician judged not indicated'];
const REJECTS = ['Out of insurance network','Wrong service','Incomplete referral'];

/* ---------- clinical rules: shared module src/rules.js (same code the benchmark tests) ---------- */
const R = window.OsteoRules;
const CATNAME = {vhigh:'Very high', high:'High', low:'Low', incomplete:'Not classified'};
function toPatient(c){
  const r0=c.res||{};
  if(c.pt) return Object.assign({}, c.pt, {t:r0.t??null, egfr:r0.egfr??null, ca:r0.ca??null, vd:r0.vd??null, spep:r0.spep??null});
  const k=c.clin, fx=[];
  if(k.fxMonths!==null) fx.push({site:k.hipVert?'hip':'wrist', months:k.fxMonths, onGc:k.fxOnGc});
  else if(k.hipVert) fx.push({site:'vert', months:60, onGc:k.fxOnGc});
  if(k.multiFx) fx.push({site:'vert', months:k.fxMonths!==null?k.fxMonths:60, onGc:k.fxOnGc});
  const r=c.res||{};
  return {age:c.age, sex:'F', menopause:'post', fractures:fx, cvEvent:k.cvEvent,
    t:r.t??null, mof:k.mof, hip:k.hip, egfr:r.egfr??null, ca:r.ca??null, vd:r.vd??null, spep:r.spep??null};
}
function category(c){ const r=R.category(toPatient(c)); return {key:r.key, name:CATNAME[r.key], why:r.fired.map(f=>f[1]), fired:r.fired}; }
/* Returns [kind, text, source]. Lab flags plus the LOCAL secondary-cause screen (SPEP) for vertebral fractures. */
function labBlocks(c){ if(!c.res) return []; const p=toPatient(c), out=R.labFlags(p).flags.map(f=>[f[1], f[2]+'.', f[3]]), s=R.secondaryScreen(p);
  if(s.text) out.push([s.block?'block':'flag', s.text+'.', s.source]); return out; }
function secBlock(c){ return !!(c && c.res && R.secondaryScreen(toPatient(c)).block); }
function treatments(c){ return R.treatments(toPatient(c)).map(t=>({id:t.id, name:t.name, kind:t.kind, block:t.block?'Blocked: '+t.block:null, why:t.kind==='first'?'First line':'Alternative'})); }

/* ---------- seeded fictional cases (days relative to today = 0) ---------- */
function mk(o){
  const st = STAGES.map(s=>({start:null,end:null,alerted:false,skip:false}));
  (o.hist||[]).forEach(([i,s,e])=>{ st[i].start=s; st[i].end=e; });
  return Object.assign({stages:st, ack:null, tbFirst:null, lang:'en', referral:{status:'none', clinic:null, reason:null, history:[]}, thread:[], checkins:[], rx:null, closed:null, log:[], res:null, ordered:false, follow:{adh:false, btm:false}}, o);
}
function seedCases(){ const A = [
  mk({id:'C-1042', name:'Mariam A.', age:64, owner:ME, lang:'ar', urgent:true,
      clin:{fxMonths:8, multiFx:false, fxOnGc:false, hipVert:false, mof:18, hip:4.1, cvEvent:false, note:'Wrist fracture 8 months ago; parent had a hip fracture'},
      hist:[[0,0,0],[1,0,null]], cur:1, demo:{t:-2.7, vd:42, egfr:68, ca:2.31}}),
  mk({id:'C-1031', name:'Aisha K.', age:69, owner:'Dr Lim',
      clin:{fxMonths:null, multiFx:false, fxOnGc:false, hipVert:false, mof:22, hip:3.4, cvEvent:false, note:'Height loss 4 cm; smoker'},
      hist:[[0,-49,-49],[1,-49,-44],[2,-44,null]], cur:2, ack:true, tbFirst:{lang:'en',pass:true}, ordered:true, demo:{t:-2.8, vd:81, egfr:55, ca:2.4}}),
  mk({id:'C-1047', name:'Nora H.', age:58, owner:null,
      clin:{fxMonths:null, multiFx:false, fxOnGc:true, hipVert:false, mof:21, hip:2.2, cvEvent:false, note:'Long-term prednisolone; no GP on record'},
      hist:[[0,-3,-3],[1,-3,null]], cur:1, demo:{t:-2.6, vd:60, egfr:90, ca:2.3}}),
  mk({id:'C-1029', name:'Fatima S.', age:71, owner:ME, urgent:true,
      clin:{fxMonths:14, multiFx:true, fxOnGc:true, hipVert:true, mof:34, hip:6.2, cvEvent:false, note:'Two vertebral fractures; on prednisolone for rheumatoid arthritis'},
      hist:[[0,-30,-30],[1,-30,-27],[2,-27,-9],[3,-9,null]], cur:3, ack:true, tbFirst:{lang:'ar',pass:false},
      res:{t:-3.2, vd:79, egfr:48, ca:2.35},
      referral:{status:'rejected', clinic:'Al Noor fracture-liaison clinic', reason:'Out of insurance network', history:[['sent',-8],['rejected',-2]]}}),

  const a=b.dataset.a; if(!a) return;
  if(a==='ci-print'){ document.body.classList.add('ci-printing'); try{ window.print(); }catch(e){} document.body.classList.remove('ci-printing'); return; }
  if(a==='intake'){ tab='intake'; inDone=null; render(); window.scrollTo(0,0); return; }
  if(a==='find-open'){ openFromFeed(FEED[+b.dataset.i]); render(); return; }
  if(a==='find-dismiss'){ const f=FEED[+b.dataset.i]; f.status='dismissed'; f.dDay=DAY; render(); return; }
  if(a==='find-skip'){ const f=FEED[+b.dataset.i], ex=f&&exclusion(f); if(ex){ f.status='skipped'; f.skipReason=ex.label.replace(/^Skip: /,'')+' ('+ex.why+')'; f.dDay=DAY; } render(); return; }
  if(a==='find-ai'){ if(!aiBusy) runFeedAI(); return; }
  if(a==='bench-ai'){ if(!aiBusy) runBenchAI(); return; }
  if(a==='bench-copy'){ const t=benchText(); navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>{bench.msg='Copied. Paste it into the chat.'; render();}).catch(()=>{bench.msg=t; render();}); return; }
  if(a==='intake-clear'){ IN=Object.assign({}, BLANK_IN); inDone=null; render(); return; }
  if(a==='intake-issue'){ issueIntake(); render(); window.scrollTo(0,0); return; }
  if(a==='fhir'||a==='fhir-copy'){ fhirAction(a==='fhir-copy'); return; }
  const c=CASES.find(x=>x.id===(b.dataset.c||sel)); if(!c) return;
  const i=curIdx(c);
  switch(a){
    case 'assign': c.owner=ME; log(c,`Ownership taken by ${ME}.`); break;
    case 'topatient': tab='patient'; break;
    case 'tospec': tab='specialist'; break;
    case 'sms': log(c,'Result resent by SMS.'); break;
    case 'ci-start': wiz={id:c.id, visit:CI.visitFor(c), step:0, a:{}}; wizDone=null; break;
    case 'ci-cancel': wiz=null; break;
    case 'ci-send': {
      const a=CI.normalise(wiz.visit, wiz.a);      // clamps scales, caps text at 1,000 characters, drops answers to hidden questions
      const fl=CI.flags(wiz.visit,a,{rx:c.rx&&c.rx.id}), crit=fl.some(f=>f[1]==='crit'), now=CI.sameDay(fl);
      c.checkins.unshift({d:DAY, visit:wiz.visit, lang:c.lang, answers:a, flags:fl, reviewed:null});
      log(c,`Patient check-in received (${wiz.visit==='first'?'before first clinic':'treatment review'}, ${LNAME[c.lang]||'English'}): ${fl.length} flag${fl.length===1?'':'s'}${crit?', urgent':''}${now?', same day':''}.`, crit?'alert':'');
      wizDone={id:c.id, crit, now}; wiz=null; break; }
    case 'ci-review': c.checkins[0].reviewed={by:ME, d:DAY}; log(c,`Patient check-in reviewed by ${ME}.`); break;
    case 'ci-adh': c.follow.adh=true; c.checkins[0].reviewed={by:ME, d:DAY}; log(c,`Adherence check accepted from patient check-in (every dose) by ${ME}.`); break;
    case 'ack':
      if(!c.tbFirst) c.tbFirst={lang:c.lang, pass:tb===0};
      if(tb===0){ c.ack=true; complete(c,1,`Patient acknowledged in ${LNAME[c.lang]||'English'}; teach-back correct.`); }
      else { c.ack=false; log(c,'Teach-back wrong. Nurse call task created.','alert'); }
      tb=null; break;
    case 'nurse': c.ack=true; complete(c,1,'Nurse call completed; patient understands next step.'); break;
    case 'order': c.ordered=true; log(c,'DXA and labs ordered'+(c.urgent?' (fast-track).':'.')); break;
    case 'results': {
      const d=resDraft[c.id]||{}, sec=R.secondaryScreen(toPatient(c));
      const r={t:num(String(d.t||'').replace('−','-')), vd:num(d.vd), egfr:num(d.egfr), ca:num(d.ca), spep:sec.required&&(d.spep==='normal'||d.spep==='abnormal')?d.spep:null};
      if(r.t===null){ msg={id:c.id, text:'Enter the lowest T-score to record the DXA result.'}; break; }
      msg=null; c.res=r; const miss=['vd','egfr','ca'].filter(k=>r[k]===null);
      complete(c,2,`DXA and labs returned: lowest T ${r.t}, vitamin D ${r.vd??'pending'}, eGFR ${r.egfr??'pending'}, calcium ${r.ca??'pending'}${sec.required?`, electrophoresis ${r.spep??'not done'}`:''}. Category now ${category(c).name}.`);
      if(miss.length) log(c,'Labs still missing: '+miss.join(', ')+'. Treatment blocks cannot be checked until they return.','alert');
      if(sec.required && r.spep===null) log(c,'Serum protein electrophoresis not done: needed before treatment (exclude myeloma).','alert');
      break; }
    case 'decide': complete(c,3,'Treatment decided in primary care per CPG.'); break;
    case 'econsult': c.referral={status:'sent', clinic:'Al Noor fracture-liaison clinic', reason:null, history:[['sent',DAY]]}; c.thread.push({who:c.owner, d:DAY, text:`${c.age}F, ${category(c).why.join('; ')}. Asking for a treatment plan.`}); log(c,'E-consult sent to Al Noor fracture-liaison clinic.'); break;
    case 'reroute': c.referral.status='rerouted'; c.referral.clinic='Corniche fracture-liaison clinic (in network)'; c.referral.history.push(['rerouted',DAY]); c.thread.push({who:c.owner, d:DAY, text:'Rerouted to an in-network clinic. Same request.'}); log(c,'Referral rerouted to Corniche fracture-liaison clinic (in network).'); break;
    case 'accept': c.referral.status='accepted'; c.referral.history.push(['accepted',DAY]); c.thread.push({who:c.referral.clinic, d:DAY, text:'Accepted. Recommend first-line treatment per CPG; happy to review.'}); complete(c,3,`Referral accepted by ${c.referral.clinic}.`); break;
    case 'reject': { const r=$('rj-'+c.id).value; c.referral.status='rejected'; c.referral.reason=r; c.referral.history.push(['rejected',DAY]); c.thread.push({who:c.referral.clinic, d:DAY, text:'Rejected: '+r}); log(c,`Referral rejected by ${c.referral.clinic}: ${r}. Back on GP board.`,'alert'); break; }
    case 'sign': { if(secBlock(c)) break; const r=treatments(c).find(x=>x.id===rxPick[c.id]); if(!r) break; c.rx={id:r.id,name:r.name,by:signer[c.id].trim(),day:DAY,dispensed:null}; log(c,`Prescription signed by ${c.rx.by}: ${r.name}.`); break; }
    case 'dispense': c.rx.dispensed=DAY; if(c.rx.id==='deno'){ c.denoDue=DAY+182; log(c,`Denosumab dispensed: next dose due day ${c.denoDue} (6 months).`); } complete(c,4,'Dispensing recorded by pharmacy.'); break;
    case 'deno-dose': c.denoDue=DAY+182; log(c,`Denosumab dose recorded by ${ME}; next dose due day ${c.denoDue}.`); break;
    case 'follow': complete(c,5,'Follow-up complete: adherence and response markers recorded.'); break;
    case 'close': {
      const ev = c.rx && c.rx.dispensed!=null && c.follow.adh && c.follow.dxa;
      if(!ev){ msg={id:c.id,text:'Closure refused: evidence incomplete (dispensing record, adherence check and repeat DXA booking are all required). Attach evidence, or close with a documented clinician decision (Patient declines…).'}; log(c,'Closure attempt refused by gate: evidence missing.','alert'); break; }
      msg=null; closeCase(c,'treated','Evidence: dispensing record, adherence check, repeat DXA booked.',ME);
      log(c,`Handed to long-term follow-up: yearly check-in from day ${c.closed.day+365}, repeat DXA in 2 years.`); break; }
    case 'drop': dropFor=c.id; break;
    case 'drop-cancel': dropFor=null; break;
    case 'drop-ok': { const r=$('dr').value, by=$('drb').value.trim()||ME; dropFor=null; closeCase(c,'drop',r,by,r); break; }
  }
  render();
});
function inVal(t){ return t.type==='checkbox'?t.checked:t.value; }
document.addEventListener('change', e=>{
  if(e.target.id==='pt-sel'){ sel=e.target.value; wiz=null; wizDone=null; tb=null; render(); return; }
  if(e.target.dataset.in){ IN[e.target.dataset.in]=inVal(e.target); if(e.target.tagName==='SELECT'||e.target.type==='checkbox'){ render(); } return; }
  if(e.target.tagName==='SELECT' && e.target.dataset.r){ (resDraft[sel]=resDraft[sel]||{})[e.target.dataset.r]=e.target.value; return; }
  const c=CASES.find(x=>x.id===sel); if(!c) return;
  if(e.target.name && e.target.name.startsWith('rx-')){ rxPick[c.id]=e.target.value; render(); }
  if(e.target.dataset.f){ c.follow[e.target.dataset.f]=e.target.checked; render(); }
});
document.addEventListener('input', e=>{
  if(e.target.dataset.in && e.target.type==='text'){ IN[e.target.dataset.in]=e.target.value; const r=$('inres'); if(r) r.innerHTML=intakeResult(); return; }
  if(wiz && e.target.dataset.wf){ const q=CI.questions(wiz.visit,wiz.a)[wiz.step];
    if(q.type==='text') wiz.a[q.id]=e.target.value; else { wiz.a[q.id]=Object.assign({}, wiz.a[q.id]||{}, {[e.target.dataset.wf]:e.target.value}); }
    const nb=document.querySelector('[data-wnext]'), L=(CASES.find(x=>x.id===sel)||{}).lang||'en', TT=PT[L]||PT.en;
    if(nb){ nb.textContent=(q.optional && !String(e.target.value).trim())?TT.skip:TT.next2; if(q.type==='text') nb.disabled=!(q.optional||String(e.target.value).trim()); }
    return; }
  if(e.target.dataset.r){ (resDraft[sel]=resDraft[sel]||{})[e.target.dataset.r]=e.target.value; return; }
  if(e.target.id==='sg'){ signer[sel]=e.target.value; const b=document.querySelector('[data-a="sign"]'); if(b) b.disabled=!(rxPick[sel] && e.target.value.trim().length>2 && !secBlock(CASES.find(x=>x.id===sel))); }
});

tick(0);
})();
</script>
