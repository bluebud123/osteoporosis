<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PeriLoop Console</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#16202a;--mut:#5b6b7a;--line:#dde3e9;--acc:#0f766e;--acc2:#0b5f58;--red:#b42318;--redbg:#fdecea;--amb:#b45309;--ambbg:#fff4e0;--grn:#15803d;--grnbg:#e6f6ec}
@media(prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#17212b;--ink:#e7edf3;--mut:#9aabba;--line:#2a3846;--acc:#2dd4bf;--acc2:#5eead4;--red:#ff8a80;--redbg:#3a1e1c;--amb:#fbbf24;--ambbg:#3a2d12;--grn:#4ade80;--grnbg:#16301f}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 Inter,system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
nav{background:var(--card);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh}
nav h1{font-size:17px;margin:0 8px 14px}nav h1 small{display:block;font-weight:400;color:var(--mut);font-size:12px}
nav button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:9px 10px;margin:2px 0;border:0;background:none;border-radius:8px;cursor:pointer}
nav button.on{background:var(--acc);color:#fff}nav button:hover:not(.on){background:var(--bg)}
.badge{background:var(--red);color:#fff;border-radius:10px;font-size:12px;padding:0 7px;min-width:20px;text-align:center}
nav .who{position:absolute;bottom:14px;left:12px;right:12px;font-size:13px;color:var(--mut)}
main{padding:22px 26px;max-width:1100px}
h2{margin:0 0 4px;font-size:22px}.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.stat b{display:block;font-size:28px}.stat span{color:var(--mut);font-size:13px}
.stat.red b{color:var(--red)}.stat.amb b{color:var(--amb)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
tr.click{cursor:pointer}tr.click:hover{background:var(--bg)}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--bg);color:var(--mut)}
.chip.red{background:var(--redbg);color:var(--red)}.chip.amb{background:var(--ambbg);color:var(--amb)}.chip.grn{background:var(--grnbg);color:var(--grn)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}.btn:hover{background:var(--acc2)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:var(--red)}.btn.sm{padding:4px 10px;font-size:13px}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 10px}label input,label select{margin-top:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:130px}.row>.fix{flex:0 0 auto;min-width:0}
.msg{padding:8px 11px;border-radius:12px;margin:6px 0;max-width:80%;white-space:pre-wrap;word-break:break-word}
.msg.patient{background:var(--acc);color:#fff;margin-left:auto}.msg.bot,.msg.ai{background:var(--bg);border:1px solid var(--line)}.msg.staff{background:var(--grnbg);border:1px solid var(--grn)}
.msg small{display:block;opacity:.75;font-size:11px;margin-top:3px}
.err{color:var(--red);font-size:13px;margin:6px 0}.ok{color:var(--grn);font-size:13px;margin:6px 0}
.banner{background:var(--ambbg);color:var(--amb);padding:8px 26px;font-size:13px;border-bottom:1px solid var(--line)}
.over{color:var(--red);font-weight:600}.mut{color:var(--mut)}
.login{max-width:360px;margin:12vh auto;padding:0 16px}
code{background:var(--bg);padding:1px 6px;border-radius:5px;font-size:13px}
@media(max-width:760px){.app{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;flex-wrap:wrap;gap:4px}nav h1{width:100%}nav .who{position:static;width:100%}main{padding:14px}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}.cal-h{font-size:12px;color:var(--mut);text-align:center;font-weight:600}.cal-d{min-height:86px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px;cursor:pointer;overflow:hidden}.cal-d.out{opacity:.45}.cal-d.today{outline:2px solid var(--acc)}.cal-d.sel{background:var(--bg)}.cal-d.over{border-color:var(--red);background:var(--redbg)}.cal-n{font-size:12px;font-weight:700;display:flex;justify-content:space-between}.cal-i{font-size:11px;margin-top:3px;border-radius:5px;padding:1px 4px}.cal-i.op{background:var(--blubg,#e8efff);color:var(--blu,#1d4ed8)}.cal-i.bl{background:var(--redbg);color:var(--red)}.cal-i.fu{background:var(--grnbg);color:var(--grn)}.click{cursor:pointer}
</style></head><body>
<div id="root"></div>
<script>
var ME=null,view='today',cur=null,poll=null;
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function api(path,body){var o=body===undefined?{}:{method:'POST',headers:{'content-type':'application/json','x-requested-with':'periloop'},body:JSON.stringify(body)};return fetch(path,o).then(function(r){return r.json().then(function(j){if(r.status===401&&path!=='/api/login'){ME=null;login();throw new Error('login')}if(!r.ok)throw j;return j})})}
function fmt(t){var d=new Date(t);return d.toLocaleDateString(undefined,{day:'numeric',month:'short'})+' '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}
function fmtD(t){return new Date(t).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}
function dueTxt(t){var h=(t.dueAt-Date.now())/3600000;if(t.state==='done')return 'done';if(h<0)return 'overdue '+(h>-48?Math.round(-h)+' h':Math.round(-h/24)+' d');return h<48?'due in '+Math.round(h)+' h':'due in '+Math.round(h/24)+' d'}
function clsChip(c){return c==='EMERGENCY'?'<span class="chip red">EMERGENCY</span>':c==='SAME-DAY'?'<span class="chip amb">SAME-DAY</span>':'<span class="chip">Question</span>'}

function login(){
 $('#root').innerHTML='<div class="login"><h2>PeriLoop Console</h2><p class="sub">Perioperative follow-up for staff</p><div class="card"><label>Username<input id="u" autocomplete="username"></label><label>Password<input id="p" type="password" autocomplete="current-password"></label><div id="e" class="err"></div><button class="btn" id="go" style="width:100%">Log in</button></div><div id="demo" class="mut" style="font-size:13px"></div></div>';
 fetch('/api/demo').then(function(r){return r.json()}).then(function(j){if(j.demo)$('#demo').innerHTML='Demo accounts (synthetic data only):<br><code>doctor</code> / <code>doctor-demo-1</code><br><code>nurse</code> / <code>nurse-demo-1</code>'});
 function go(){api('/api/login',{username:$('#u').value,password:$('#p').value}).then(boot).catch(function(e){$('#e').textContent=e.error==='too_many_attempts'?'Too many attempts. Wait a few minutes.':'Wrong username or password.'})}
 $('#go').onclick=go;$('#p').onkeydown=function(e){if(e.key==='Enter')go()};
}
function boot(){api('/api/me').then(function(m){ME=m;if(location.hash==='#live'){location.href='/live';return}shell();show('today')}).catch(function(){})}
var counts={};
function shell(){
 $('#root').innerHTML=(ME.settings.demoBanner?'<div class="banner">Demo system. Use fictional patients only. Nothing here is clinically validated.'+(ME.demoHost&&ME.demoResetMin?' This public demo puts itself back to its starting state after '+ME.demoResetMin+' minutes without activity.':'')+'</div>':'')+'<div class="app"><nav><h1>PeriLoop<small>Console</small></h1><div id="nv"></div><div class="who">'+esc(ME.name)+' · '+esc(ME.role)+'<br><a href="#" id="lo" style="color:var(--mut)">Log out</a></div></nav><main id="main"></main></div>';
 $('#lo').onclick=function(e){e.preventDefault();api('/api/logout',{}).then(function(){login()})};
 nav();
}
function nav(){
 var items=[['live','Live view'],['today','Today'],['patients','Patients'],['calendar','Calendar',counts.overCapacity],['inbox','Inbox',counts.needsReply],['alerts','Alerts',counts.openAlerts],['learning','Learning',counts.lessonsToReview],['rules','Rules'],['settings','Settings']];
 $('#nv').innerHTML=items.map(function(i){return '<button data-v="'+i[0]+'" class="'+(view===i[0]?'on':'')+'">'+i[1]+(i[2]?'<span class="badge">'+i[2]+'</span>':'')+'</button>'}).join('');
 document.querySelectorAll('#nv button').forEach(function(b){b.onclick=function(){if(b.dataset.v==='live'){window.open('/live','periloop-live');return}show(b.dataset.v)}});
}
function refreshCounts(){return api('/api/summary').then(function(s){counts=s;nav();return s})}
function show(v,arg){view=v;cur=arg||null;clearInterval(poll);nav();({today:vToday,patients:vPatients,calendar:vCalendar,inbox:vInbox,alerts:vAlerts,learning:vLearning,rules:vRules,settings:vSettings,patient:vPatient})[v]();
 if(v==='inbox'||v==='alerts'||v==='today'||v==='patient'){poll=setInterval(function(){if(document.hidden)return;if(v==='patient'){if(!document.activeElement||document.activeElement.tagName!=='TEXTAREA'&&document.activeElement.tagName!=='INPUT')vPatient(true)}else if(!document.activeElement||!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))({today:vToday,inbox:vInbox,alerts:vAlerts})[v]()},6000)}
}
function main(h){$('#main').innerHTML=h}

function vToday(){
 Promise.all([refreshCounts(),api('/api/alerts'),api('/api/patients')]).then(function(r){
  var s=r[0],al=r[1].filter(function(a){return !a.ackAt}),pts=r[2];
  var risky=pts.filter(function(p){return p.overdue||p.openAlerts||p.needsReply}).sort(function(a,b){return b.openAlerts-a.openAlerts||b.overdue-a.overdue});
  main('<h2>Today</h2><p class="sub">What needs a person, right now.</p><div id="capb"></div>'+(s.setup?'<div class="card" style="border-color:var(--amb)"><b>Before real use:</b> the clinic phone and hours are not set. Until a doctor sets them in Settings, patients are told to use the number on their appointment card.</div>':(s.demoContact?'<div class="card"><b>Demo contact details in use.</b> Patients are shown a fictional phone number and hours. A doctor replaces them in Settings before real use.</div>':''))+(!s.ai?'<div class="card"><b>AI second check is off.</b> Messages are screened by the fixed rules only, which miss some urgent messages. To turn the check on, start the server with PROVIDER_BASE_URL, PROVIDER_KEY and PROVIDER_MODEL set (see app/README.md), then confirm it in Settings.</div>':'')+'<div class="card"><b>Showing this to someone?</b> The <a href="/live" target="periloop-live">Live view</a> puts the patient chat, the screening steps and the staff panel side by side.</div>'+'<div class="grid"><div class="stat '+(s.openAlerts?'red':'')+'"><b>'+s.openAlerts+'</b><span>Open alerts</span></div><div class="stat '+(s.needsReply?'amb':'')+'"><b>'+s.needsReply+'</b><span>Messages waiting</span></div><div class="stat '+(s.overdue?'amb':'')+'"><b>'+s.overdue+'</b><span>Overdue tasks</span></div><div class="stat"><b>'+s.patients+'</b><span>Patients</span></div></div><div style="height:14px"></div>'
  +'<div class="card"><h3 style="margin-top:0">Alerts to acknowledge</h3>'+(al.length?'<table>'+al.map(function(a){return '<tr><td>'+clsChip(a.cls)+'</td><td><b>'+esc(a.name)+'</b> · '+esc(a.rn)+'<br><span class="mut">"'+esc(a.text)+'"</span>'+(a.count>1?' <span class="chip">×'+a.count+'</span>':'')+'<br><span class="mut" style="font-size:12px">'+fmt(a.at)+' · '+esc(a.reason||'')+'</span></td><td style="text-align:right"><button class="btn sm" data-ack="'+a.id+'">Acknowledge</button> <button class="btn sm ghost" data-open="'+a.pid+'">Open</button></td></tr>'}).join('')+'</table>':'<span class="mut">None. Quiet is not proof of safety: check the Inbox and overdue tasks.</span>')+'</div>'
  +'<div class="card"><h3 style="margin-top:0">Patients needing attention</h3>'+(risky.length?ptTable(risky):'<span class="mut">Nobody overdue, no waiting messages.</span>')+'</div>');
  wireAck();wireRows();
  api('/api/calendar?from='+dkey(new Date())+'&to='+dkey(new Date(Date.now()+60*864e5))).then(function(c){if(c.over.length&&$('#capb'))$('#capb').innerHTML='<div class="card" style="border-color:var(--red);background:var(--redbg)"><b style="color:var(--red)">Theatre list over the limit ('+c.max+' cases/day):</b> '+c.over.map(function(o){return esc(o.date)+' has '+o.count+' cases'}).join(' · ')+' <a href="#" id="gcal">Open calendar</a></div>';if($('#gcal'))$('#gcal').onclick=function(e){e.preventDefault();show('calendar')}});
 }).catch(function(){});
}

function dkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
var calMonth=null,calSel=null;
function vCalendar(){
 var now=new Date();if(!calMonth)calMonth=new Date(now.getFullYear(),now.getMonth(),1);
 var first=new Date(calMonth),start=new Date(first);start.setDate(1-((first.getDay()+6)%7));var end=new Date(start);end.setDate(start.getDate()+41);
 api('/api/calendar?from='+dkey(start)+'&to='+dkey(end)).then(function(c){
  var by={};c.days.forEach(function(d){by[d.date]=d});
  var cells='';for(var i=0;i<42;i++){var dt=new Date(start);dt.setDate(start.getDate()+i);var k=dkey(dt),d=by[k]||{ops:[],bloods:[],followups:[]},inM=dt.getMonth()===calMonth.getMonth(),over=d.ops.length>c.max,isT=k===c.today;
   cells+='<div class="cal-d'+(inM?'':' out')+(over?' over':'')+(isT?' today':'')+(calSel===k?' sel':'')+'" data-k="'+k+'"><div class="cal-n">'+dt.getDate()+(over?' <span class="chip red">'+d.ops.length+' &gt; '+c.max+'</span>':'')+'</div>'
    +(d.ops.length&&!over?'<div class="cal-i op">⚕ '+d.ops.length+' op'+(d.ops.length>1?'s':'')+'</div>':'')+(over?'<div class="cal-i op" style="font-weight:700">⚕ '+d.ops.length+' ops OVER LIMIT</div>':'')
    +(d.bloods.length?'<div class="cal-i bl">🩸 '+d.bloods.length+' bloods</div>':'')+(d.followups.length?'<div class="cal-i fu">📅 '+d.followups.length+' visit'+(d.followups.length>1?'s':'')+'</div>':'')+'</div>'}
  var sel=calSel&&by[calSel];
  var detail=calSel?'<div class="card"><h3 style="margin-top:0">'+esc(calSel)+'</h3>'+(sel?(sel.ops.length?'<b>Operations ('+sel.ops.length+(sel.ops.length>c.max?' · over the limit of '+c.max:'')+')</b>'+sel.ops.map(function(o){return '<div class="click" data-pid="'+o.pid+'" style="padding:4px 0">'+esc(o.name)+' · '+esc(o.rn)+' · '+esc(o.proc)+(o.flags?' <span class="chip amb">'+o.flags+' flag(s)</span>':'')+'</div>'}).join(''):'')+(sel.bloods.length?'<b>Blood tests / results due</b>'+sel.bloods.map(function(o){return '<div class="click" data-pid="'+o.pid+'" style="padding:4px 0">'+esc(o.name)+' · '+esc(o.rn)+' · '+esc(o.title)+(o.state==='done'?' <span class="chip grn">done</span>':'')+'</div>'}).join(''):'')+(sel.followups.length?'<b>Follow-up visits</b>'+sel.followups.map(function(o){return '<div class="click" data-pid="'+o.pid+'" style="padding:4px 0">'+esc(o.name)+' · '+esc(o.rn)+' · '+esc(o.title)+'</div>'}).join(''):''):'<span class="mut">Nothing scheduled.</span>')+'</div>'+(sel&&sel.ops.length>c.max?'<div class="card" id="rsg" style="border-color:var(--red)"><span class="mut">Working out where a case could move...</span></div>':''):'<p class="mut">Click a day to see who is booked.</p>';
  main('<h2>Calendar</h2><p class="sub">Operation dates, blood tests and follow-up visits from each patient\'s checklist. A day with more than '+c.max+' operations is flagged red'+(ME.role==='doctor'?' (change the limit in Settings)':'')+'.</p>'
   +(c.over.length?'<div class="card" style="border-color:var(--red);background:var(--redbg)"><b style="color:var(--red)">Over the limit:</b> '+c.over.map(function(o){return esc(o.date)+' ('+o.count+' cases)'}).join(' · ')+'</div>':'')
   +'<div class="row" style="align-items:center;margin-bottom:8px"><div class="fix"><button class="btn ghost sm" id="cp1">←</button> <b style="margin:0 10px">'+calMonth.toLocaleDateString(undefined,{month:'long',year:'numeric'})+'</b> <button class="btn ghost sm" id="cp2">→</button> <button class="btn ghost sm" id="cp3">Today</button></div></div>'
   +'<div class="cal"><div class="cal-h">Mon</div><div class="cal-h">Tue</div><div class="cal-h">Wed</div><div class="cal-h">Thu</div><div class="cal-h">Fri</div><div class="cal-h">Sat</div><div class="cal-h">Sun</div>'+cells+'</div><p class="mut" style="font-size:12px">⚕ operation · 🩸 blood test or result review due · 📅 follow-up visit</p>'+detail);
  $('#cp1').onclick=function(){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1);vCalendar()};$('#cp2').onclick=function(){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1);vCalendar()};$('#cp3').onclick=function(){calMonth=null;calSel=dkey(new Date());vCalendar()};
  document.querySelectorAll('.cal-d').forEach(function(e){e.onclick=function(){calSel=e.dataset.k;vCalendar()}});wireRows2();
  if($('#rsg'))api('/api/calendar/suggest?date='+calSel).then(function(g){if(!$('#rsg'))return;var isDoc=ME.role==='doctor';
   var h='<h3 style="margin-top:0">Suggested change <span class="chip red">'+g.count+' booked, limit '+g.max+'</span></h3><p class="mut" style="font-size:13px">Move '+g.excess+' case'+(g.excess>1?'s':'')+'. Fixed rules, no AI: patients who are least ready are listed first, and only weekdays with space are offered. A doctor decides; nothing moves by itself.</p>';
   if(!g.days.length)h+='<div class="mut">No weekday with space in the next three weeks. Raise the limit in Settings or pick a date on the patient page.</div>';
   h+='<table>'+g.candidates.map(function(c,i){return '<tr><td style="width:30%"><b>'+esc(c.name)+'</b> · '+esc(c.rn)+(c.age!=null?' · '+c.age+' y':'')+(c.sex?' '+esc(c.sex):'')+'<br><span class="mut" style="font-size:13px">'+esc(c.proc)+'</span>'+(i<g.excess?' <span class="chip amb">suggested to move</span>':'')+'</td><td style="font-size:13px">'+esc(c.why)+'</td><td style="text-align:right;white-space:nowrap">'+(isDoc?g.days.slice(0,3).map(function(d){return '<button class="btn ghost sm" data-mv="'+c.pid+'" data-to="'+d.date+'" title="'+d.count+' booked, '+d.free+' free">'+d.weekday+' '+esc(d.date.slice(5))+' ('+d.free+' free)</button>'}).join(' '):'<span class="mut" style="font-size:12px">a doctor can move this</span>')+'</td></tr>'}).join('')+'</table><div class="mut" id="rse" style="font-size:13px;margin-top:6px">Moving a case shifts its open checklist tasks by the same number of days and adds a task to tell the patient. The patient is not messaged automatically.</div>';
   $('#rsg').innerHTML=h;
   document.querySelectorAll('[data-mv]').forEach(function(b){b.onclick=function(){if(!confirm('Move this operation from '+calSel+' to '+b.dataset.to+'?'))return;api('/api/patients/'+b.dataset.mv+'/reschedule',{otDate:b.dataset.to,reason:'day over the limit'}).then(function(){vCalendar()}).catch(function(x){$('#rse').textContent=x&&x.message||'Could not move.'})}});
  }).catch(function(){if($('#rsg'))$('#rsg').innerHTML='<span class="mut">Could not work out a suggestion.</span>'});
 }).catch(function(){});
}
function wireRows2(){document.querySelectorAll('div[data-pid]').forEach(function(r){r.onclick=function(){show('patient',r.dataset.pid)}})}
function wireAck(){document.querySelectorAll('[data-ack]').forEach(function(b){b.onclick=function(){api('/api/alerts/'+b.dataset.ack+'/ack',{}).then(function(){show(view,cur)})}});document.querySelectorAll('[data-open]').forEach(function(b){b.onclick=function(){show('patient',b.dataset.open)}})}
function wireRows(){document.querySelectorAll('tr[data-pid]').forEach(function(r){r.onclick=function(){show('patient',r.dataset.pid)}})}
function ptTable(pts){return '<table><tr><th>Patient</th><th>Procedure</th><th>Operation</th><th>Tasks</th><th>Flags</th></tr>'+pts.map(function(p){return '<tr class="click" data-pid="'+p.id+'"><td><b>'+esc(p.name)+'</b><br><span class="mut">'+esc(p.rn)+(p.age!=null?' · '+p.age+' y':'')+(p.sex?' · '+esc(p.sex):'')+'</span>'+(p.como&&p.como.length?'<br><span class="mut" style="font-size:12px">'+esc(p.como.slice(0,3).join(' · '))+'</span>':'')+'</td><td>'+esc(p.procLabel)+'</td><td>'+esc(p.otDate)+'</td><td>'+p.open+' open'+(p.overdue?' · <span class="over">'+p.overdue+' overdue</span>':'')+'</td><td>'+(p.redFlags?'<span class="chip red">'+p.redFlags+' red flag</span> ':'')+(p.flags-p.redFlags>0?'<span class="chip amb">'+(p.flags-p.redFlags)+' amber</span> ':'')+(p.openAlerts?'<span class="chip red">'+p.openAlerts+' alert</span> ':'')+(p.needsReply?'<span class="chip amb">'+p.needsReply+' waiting</span>':'')+(!p.linked?' <span class="chip">link not used yet</span>':'')+'</td></tr>'}).join('')+'</table>'}

function vPatients(){
 api('/api/patients').then(function(pts){
  var procs=ME.procedures.map(function(p){return '<option value="'+esc(p.key)+'">'+esc(p.label)+'</option>'}).join('');
  var langs=Object.keys(ME.langs).map(function(k){return '<option value="'+k+'">'+esc(ME.langs[k])+'</option>'}).join('');
  main('<h2>Patients</h2><p class="sub">Add a patient to create their checklist from the pathway rules, and get a private chat link for them.</p>'

function vAlerts(){

 }).catch(function(){});

var PW=null;
function vLearning(){
 Promise.all([refreshCounts(),api('/api/learning')]).then(function(r){var d=r[1],R=d.report,T={};d.tags.forEach(function(t){T[t.id]=t.label});
  var prop=d.lessons.filter(function(l){return l.status==='proposed'}),appr=d.lessons.filter(function(l){return l.status==='approved'}),can=d.canDecide;
  function tagChips(l){return l.tags.map(function(t){return '<span class="chip">'+esc(T[t]||t)+'</span>'}).join(' ')}
  function stat(n,label){return '<div style="min-width:130px"><div style="font-size:22px;font-weight:700">'+n+'</div><div class="mut" style="font-size:13px">'+label+'</div></div>'}

  h+='<div class="card"><h3 style="margin-top:0">Lessons to review '+(prop.length?'<span class="chip amb">'+prop.length+'</span>':'')+'</h3>'+(prop.length?prop.map(function(l){return '<div style="margin:8px 0;padding:10px;border:1px dashed var(--line);border-radius:8px">'+tagChips(l)+(can?'<textarea rows="2" style="width:100%;margin-top:6px" data-lt="'+l.id+'">'+esc(l.text)+'</textarea>':'<div style="margin-top:6px"><b>'+esc(l.text)+'</b></div>')+'<div class="mut" style="font-size:13px">Proposed by the AI from '+l.basedOn.length+' correction(s)'+(l.example?', for example: “'+esc(l.example)+'”':'')+' · '+fmt(l.at)+'</div>'+(can?'<div style="margin-top:6px"><button class="btn sm" data-la="'+l.id+'">Approve</button> <button class="btn ghost sm" data-lr="'+l.id+'">Reject</button> <span class="mut" style="font-size:12px">You can edit the wording before approving.</span></div>':'')+'</div>'}).join(''):'<div class="mut">Nothing waiting.</div>')
   +'<div style="margin-top:10px">'+(can?(d.aiOn&&R.newSignals?'<button class="btn" id="lsg">Ask the AI to propose lessons from '+R.newSignals+' new correction(s)</button> ':'<span class="mut" style="font-size:13px">'+(d.aiOn?'No new corrections to learn from yet. ':'')+'</span>'):'')+'<span class="mut" id="lsn" style="font-size:13px">'+(d.aiOn?'':'The AI is not connected. The chief doctor can still write lessons by hand.')+(can?'':' Only the chief doctor can approve, write or retire lessons.')+'</span></div></div>';
  h+='<div class="card"><h3 style="margin-top:0">Approved lessons <span class="chip">'+appr.length+'</span></h3><p class="mut" style="font-size:13px">For each patient message only the lessons whose topics match are given to the AI (at most five), so this list can grow without slowing it down.</p>'+(appr.length?'<table>'+appr.map(function(l){return '<tr><td>'+esc(l.text)+'<br>'+tagChips(l)+' <span class="mut" style="font-size:12px">approved by '+esc(l.approvedBy)+' · '+fmt(l.approvedAt)+' · used in '+(l.uses||0)+' draft(s)'+((l.sentUnchanged||0)+(l.rewritten||0)?' · those drafts: '+(l.sentUnchanged||0)+' sent unchanged, '+(l.rewritten||0)+' rewritten'+((l.rewritten||0)>=3&&(l.rewritten||0)>(l.sentUnchanged||0)*2?' <span class="chip amb">may not be working</span>':''):'')+(l.by&&/^AI/.test(l.by)?' · proposed by the AI':'')+'</span></td><td style="text-align:right">'+(can?'<button class="btn ghost sm" data-lr="'+l.id+'">Retire</button>':'')+'</td></tr>'}).join('')+'</table>':'<div class="mut">None yet.</div>')
   +(can?'<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)"><b>Write a lesson</b><textarea id="lnew" rows="2" style="width:100%;margin-top:6px" maxlength="240" placeholder="One sentence about wording or what to mention. Example: Offer the physiotherapy phone line when a patient asks about exercises."></textarea><div style="margin:8px 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 14px">'+d.tags.filter(function(t){return t.id!=='triage'}).map(function(t){return '<label style="display:flex;align-items:center;gap:8px;font-size:13px;margin:0"><input type="checkbox" class="lng" value="'+t.id+'" style="width:16px;height:16px;flex:0 0 16px;margin:0"><span>'+esc(t.label)+'</span></label>'}).join('')+'</div><button class="btn sm" id="ladd">Add lesson</button> <span class="mut" id="lerr" style="font-size:13px"></span></div>':'')+'</div>';
  h+='<div class="card"><h3 style="margin-top:0">Questions with no clinic answer <span class="chip">'+R.unansweredQuestions+'</span></h3><p class="mut" style="font-size:13px">Patients asked these and the assistant could only pass them on. A topic that keeps coming up may need an approved answer on the Rules page.</p>'+(R.unansweredByTopic.length?'<div style="margin-bottom:8px">'+R.unansweredByTopic.map(function(t){return '<span class="chip">'+esc(t.label)+' ×'+t.count+'</span>'}).join(' ')+'</div>'+R.unansweredRecent.map(function(q){return '<div style="margin:4px 0;font-size:14px">“'+esc(q.text.slice(0,140))+'” <span class="mut" style="font-size:12px">'+fmt(q.at)+'</span></div>'}).join(''):'<div class="mut">None recorded yet.</div>')+'</div>';
  h+='<div class="card"><h3 style="margin-top:0">System report</h3><p class="mut" style="font-size:13px">Counts only, no AI. Use it to decide what to fix in the rules, the answers or the software.</p><div style="display:flex;gap:18px;flex-wrap:wrap">'
   +stat(R.patientMessages,'patient messages')+stat(R.alerts,'alerts ('+R.emergencies+' emergency)')+stat(R.alertsMarkedNotUrgent,'alerts a doctor marked not urgent')+stat(R.messagesThatShouldHaveAlerted,'messages that should have alerted')+stat(R.aiCheckUnavailable,'messages where the AI check was unavailable')
   +stat(R.draftsRequested,'AI drafts made')+stat(R.draftsSentUnchanged,'AI drafts sent unchanged')+stat(R.draftsRewritten,'AI drafts rewritten')+stat(R.profileProposed,'profile facts proposed by the AI')+stat(R.profileConfirmed,'of those, confirmed')+stat(R.profileDismissed,'profile facts dismissed')+'</div></div>';
  h+='<div class="card"><h3 style="margin-top:0">Recent corrections</h3>'+(d.signals.length?'<table>'+d.signals.slice(0,25).map(function(g){return '<tr><td><span class="chip">'+esc(d.signalLabels[g.type]||g.type)+'</span>'+(g.processed?' <span class="mut" style="font-size:12px">read by the AI</span>':' <span class="chip amb">new</span>')+'<br><span style="font-size:14px">'+(g.type==='draft_edit'?'Draft: “'+esc(String(g.draft).slice(0,120))+'” → sent: “'+esc(String(g.sent).slice(0,120))+'”':g.type==='memory_dismissed'?esc(g.fact)+' (patient wrote: “'+esc(String(g.quote).slice(0,100))+'”)':'“'+esc(String(g.text).slice(0,160))+'”')+'</span></td><td class="mut" style="font-size:12px;white-space:nowrap">'+fmt(g.at)+'</td></tr>'}).join('')+'</table>':'<div class="mut">None yet. Corrections appear when staff rewrite an AI draft, dismiss a proposed patient fact, mark an alert as not urgent, or mark a message that should have alerted.</div>')+'</div>';
  main(h);
  document.querySelectorAll('[data-la]').forEach(function(b){b.onclick=function(){var ta=document.querySelector('[data-lt="'+b.dataset.la+'"]');api('/api/lessons/'+b.dataset.la,{action:'approve',text:ta?ta.value:''}).then(function(x){if(x&&x.error){$('#lsn').textContent=x.message||'Could not approve.';return}vLearning()})}});
  document.querySelectorAll('[data-lr]').forEach(function(b){b.onclick=function(){api('/api/lessons/'+b.dataset.lr,{action:'retire'}).then(function(){vLearning()})}});
  if($('#lsg'))$('#lsg').onclick=function(){$('#lsg').disabled=true;$('#lsn').textContent='Reading the corrections...';api('/api/lessons/suggest',{}).then(function(x){if(x&&x.message){$('#lsn').textContent=x.message;setTimeout(vLearning,2500)}else vLearning()})};
  if($('#ladd'))$('#ladd').onclick=function(){var tg=[].slice.call(document.querySelectorAll('.lng:checked')).map(function(c){return c.value});api('/api/lessons',{text:$('#lnew').value,tags:tg}).then(function(x){if(x&&x.error){$('#lerr').textContent=x.message||'Could not add.';return}vLearning()})};
 }).catch(function(){});
}
function vRules(local){
 api('/api/rules').then(function(r){
  PW=JSON.parse(JSON.stringify(local||r.pathway));var isDoc=ME.role==='doctor';
  var ownerOpts=function(sel){return Object.keys(ME.owners).map(function(k){return '<option value="'+k+'"'+(k===sel?' selected':'')+'>'+esc(ME.owners[k])+'</option>'}).join('')};
  function itemsHtml(list,key){return list.map(function(it,i){return '<div class="row" style="margin-bottom:6px"><input data-k="'+key+'" data-i="'+i+'" data-f="title" value="'+esc(it.title)+'" '+(isDoc?'':'disabled')+'><select class="fix" data-k="'+key+'" data-i="'+i+'" data-f="owner" '+(isDoc?'':'disabled')+'>'+ownerOpts(it.owner)+'</select><input class="fix" style="width:80px" type="number" data-k="'+key+'" data-i="'+i+'" data-f="due" value="'+it.due+'" title="Days relative to the operation (-14 = 14 days before)" '+(isDoc?'':'disabled')+'>'+(isDoc?'<button class="btn ghost sm fix" data-del="'+key+'|'+i+'">✕</button>':'')+'</div>'}).join('')+(isDoc?'<button class="btn ghost sm" data-addi="'+key+'">+ Add item</button>':'')}
  var h='<h2>Rules</h2><p class="sub">'+(isDoc?'Edit what every patient\'s checklist contains and when it is due. Changes apply to patients added from now on (use "Add missing items" on a patient to update an existing one).':'Read only. A doctor can change these.')+'</p>';
  h+='<div class="card"><h3 style="margin-top:0">Checklist for every patient</h3><div class="mut" style="font-size:13px;margin-bottom:8px">Task · who owns it · due day (negative = before the operation)</div>'+itemsHtml(PW.shared,'shared')+'</div>';
  Object.keys(PW.procedures).forEach(function(k){h+='<div class="card"><h3 style="margin-top:0">'+esc(PW.procedures[k].label)+' <span class="mut" style="font-weight:400">extra items</span></h3>'+itemsHtml(PW.procedures[k].items,'p:'+k)+'</div>'});
  if(isDoc)h+='<div class="card"><button class="btn" id="svp">Save checklist rules</button> <span id="pm" class="ok"></span></div>';
  h+='<div class="card"><h3 style="margin-top:0">Extra red-flag phrases</h3><p class="sub" style="margin:0 0 10px">Words your clinic wants treated as urgent. They can only raise urgency, never lower it. The built-in red-flag rules (breathing, chest pain, bleeding, nerve and bladder signs and more) are fixed and are not editable here.</p><div id="rf"></div>'+(isDoc?'<div class="row"><label>Phrase<input id="rfp" placeholder="e.g. kaki pelik"></label><label>Treat as<select id="rfc"><option value="SAME-DAY">Same-day review</option><option value="EMERGENCY">Emergency (send to ED)</option></select></label><div class="fix"><button class="btn" id="rfa">Add phrase</button></div></div><div id="rfe" class="err"></div>':'')+'</div>';
  h+='<div class="card"><h3 style="margin-top:0">Clinic answer library</h3><p class="sub" style="margin:0 0 10px">Fixed texts for the questions patients ask most. A patient always sees the text exactly as written here. Keywords pick the text; when the AI is on it may also choose one, but it never writes one. <b>Every text below was drafted by an AI.</b> A doctor approves it, or switches it off. Draft texts are shown to patients only while "Use draft clinic answers" is on in Settings, and are labelled as drafts.</p><div id="anl" class="mut">Loading…</div></div>';
  h+='<div class="card"><h3 style="margin-top:0">Approved answers</h3><p class="sub" style="margin:0 0 10px">Answers a doctor has written for common questions (for example showering or driving). When a patient message contains one of the keywords and nothing urgent is found, the patient sees exactly this text, labelled as a clinic-approved answer. Nothing else is ever added to it.</p><div id="fq"></div>'+(isDoc?'<label>Keywords (comma separated)<input id="fk" placeholder="shower, mandi, bath"></label><label>Approved answer<textarea id="fa" rows="3" placeholder="You may shower from day 2 if the dressing stays dry. Cover it with the waterproof dressing."></textarea></label><button class="btn" id="fadd">Add approved answer</button><div id="fe" class="err"></div>':'')+'</div>';
  main(h);
  function anList(){api('/api/answers').then(function(a){$('#anl').className='';$('#anl').innerHTML='<table>'+a.topics.map(function(t){var chip=t.status==='approved'?'<span class="chip" style="background:#e6f6ec;color:#15803d">approved by '+esc(t.by)+'</span>':t.status==='off'?'<span class="chip">switched off</span>':'<span class="chip" style="background:#fff4e0;color:#8a4b00">draft'+(a.useDrafts?', in use':', not shown')+'</span>';return '<tr><td style="width:68%"><b>'+esc(t.title)+'</b> '+chip+'<br><span style="font-size:13px">'+esc(t.text)+'</span><br><span class="mut" style="font-size:12px">'+(t.staff?'Also goes to the Inbox for '+esc(t.owner):'Answered without adding to the Inbox')+'</span></td><td>'+(isDoc?(t.status!=='approved'?'<button class="btn sm" data-an="'+t.id+'|approve">Approve</button> ':'')+(t.status!=='off'?'<button class="btn ghost sm" data-an="'+t.id+'|off">Switch off</button>':'<button class="btn ghost sm" data-an="'+t.id+'|draft">Back to draft</button>'):'')+'</td></tr>'}).join('')+'</table>';document.querySelectorAll('[data-an]').forEach(function(b){b.onclick=function(){var x=b.dataset.an.split('|');api('/api/answers/'+x[0]+'/'+x[1],{}).then(anList)}})}).catch(function(){})}
  anList();
  function fqList(fs){$('#fq').innerHTML=fs.length?'<table>'+fs.map(function(x){return '<tr><td><b>'+esc(x.keywords.join(', '))+'</b><br>'+esc(x.answer)+'<br><span class="mut" style="font-size:12px">approved by '+esc(x.addedBy)+' · '+fmt(x.at)+'</span></td><td>'+(isDoc?'<button class="btn ghost sm" data-fd="'+x.id+'">Remove</button>':'')+'</td></tr>'}).join('')+'</table>':'<span class="mut">None yet.</span>';document.querySelectorAll('[data-fd]').forEach(function(b){b.onclick=function(){api('/api/rules/faq/'+b.dataset.fd+'/delete',{}).then(function(){vRules(PW)})}})}
  fqList(r.faqs||[]);
  if(isDoc)$('#fadd').onclick=function(){api('/api/rules/faq',{keywords:$('#fk').value,answer:$('#fa').value}).then(function(){vRules(PW)}).catch(function(e){$('#fe').textContent=e.message||'Could not add.'})};
  function rfList(rs){$('#rf').innerHTML=rs.length?'<table>'+rs.map(function(x){return '<tr><td>"'+esc(x.phrase)+'"</td><td>'+(x.cls==='EMERGENCY'?'<span class="chip red">Emergency</span>':'<span class="chip amb">Same-day</span>')+'</td><td class="mut">'+esc(x.addedBy)+' · '+fmt(x.at)+'</td><td>'+(isDoc?'<button class="btn ghost sm" data-rd="'+x.id+'">Remove</button>':'')+'</td></tr>'}).join('')+'</table>':'<span class="mut">None added.</span>';document.querySelectorAll('[data-rd]').forEach(function(b){b.onclick=function(){api('/api/rules/redflag/'+b.dataset.rd+'/delete',{}).then(function(){vRules(PW)})}})}
  rfList(r.redflags);
  if(!isDoc)return;
  function listOf(key){return key==='shared'?PW.shared:PW.procedures[key.slice(2)].items}
  document.querySelectorAll('[data-f]').forEach(function(el){el.onchange=function(){var l=listOf(el.dataset.k),it=l[+el.dataset.i];it[el.dataset.f]=el.dataset.f==='due'?Number(el.value):el.value}});
  document.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){var a=b.dataset.del.split('|');listOf(a[0]).splice(+a[1],1);redraw()}});
  document.querySelectorAll('[data-addi]').forEach(function(b){b.onclick=function(){listOf(b.dataset.addi).push({title:'New task',owner:'ward_nurse',due:0,kind:'review'});redraw()}});
  function redraw(){vRules(PW)}
  $('#svp').onclick=function(){api('/api/rules/pathway',{pathway:PW}).then(function(){$('#pm').textContent='Saved. New patients get these items.'}).catch(function(e){$('#pm').textContent='Could not save.'})};
  $('#rfa').onclick=function(){api('/api/rules/redflag',{phrase:$('#rfp').value,cls:$('#rfc').value}).then(function(){vRules(PW)}).catch(function(e){$('#rfe').textContent=e.message||'Could not add.'})};
 }).catch(function(){});
}
function vSettings(){

  if(isDoc){$('#sv').onclick=function(){api('/api/settings',{clinicPhone:$('#sp').value,sessionsText:$('#ss').value,maxCasesPerDay:$('#mc').value,emergencyNumber:$('#sem').value,useDraftAnswers:$('#sdr').checked}).then(function(){ME.settings.emergencyNumber=$('#sem').value;ME.settings.useDraftAnswers=$('#sdr').checked;ME.settings.maxCasesPerDay=Number($('#mc').value);ME.settings.clinicPhone=$('#sp').value;ME.settings.sessionsText=$('#ss').value;$('#sm').className='ok';$('#sm').textContent='Saved.'}).catch(function(e){$('#sm').className='err';$('#sm').textContent=e.message||'Could not save.'})};
   $('#au').onclick=function(){api('/api/users',{username:$('#nu').value,name:$('#nn').value,role:$('#nr').value,password:$('#npw').value}).then(vSettings).catch(function(e){$('#ue').textContent=e.message||'Could not add.'})};
   if($('#frs'))$('#frs').onclick=function(){if(!confirm('Put the whole demo back to its starting state? Everything anyone has changed will be lost.'))return;$('#frm').textContent='Resetting...';api('/api/demo/full-reset',{}).then(function(r){$('#frm').textContent='Done: '+r.patients+' fictional patients reloaded.'}).catch(function(x){$('#frm').textContent=x&&x.message||'Could not reset.'})};
   $('#aud').onclick=function(){api('/api/audit').then(function(a){$('#al').innerHTML='<table>'+a.map(function(x){return '<tr><td class="mut">'+fmt(x.at)+'</td><td>'+esc(x.who)+'</td><td>'+esc(x.what)+'</td></tr>'}).join('')+'</table>'})}}
  $('#tst').onclick=function(){$('#tr').textContent='Testing…';api('/api/ai/test',{}).then(function(r){$('#tr').innerHTML=r.message?esc(r.message):(r.ok?'<span class="ok">Connected.</span> Second check: '+esc(r.secondCheck)+'. Sample reply: "'+esc(r.reply)+'"':'<span class="err">The model could not be reached (check the key, model name and internet).</span>')})};
  $('#cpw').onclick=function(){api('/api/password',{password:$('#np').value}).then(function(){$('#pe').className='ok';$('#pe').textContent='Password changed.'}).catch(function(e){$('#pe').className='err';$('#pe').textContent=e.message||'Could not change.'})};
 });
}
boot();
</script></body></html>
